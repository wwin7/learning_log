<script>
  (function() {
    const form = document.getElementById('entryEditorForm');
    const textarea = document.getElementById('id_text');
    const tagsInput = document.getElementById('id_tags');
    const saveStatus = document.getElementById('editorSaveStatus');
    const selectionToolbar = document.getElementById('selectionToolbar');
    const draftKey = form ? form.dataset.draftKey : '';
    const storageKey = draftKey ? `yuque-editor:${draftKey}` : '';
    const headingSelect = document.getElementById('headingSelect');
    const fontSizeSelect = document.getElementById('fontSizeSelect');
    let saveTimer = null;
    let hideToolbarTimer = null;
    let isFullscreen = false;

    if (!form || !textarea || !saveStatus || !selectionToolbar || !headingSelect || !fontSizeSelect) {
      return;
    }

    function setStatus(text, saving) {
      saveStatus.textContent = text;
      saveStatus.classList.toggle('yuque-saved-dot', !saving);
      saveStatus.classList.toggle('yuque-saving-dot', saving);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function saveDraft() {
      if (!storageKey) {
        return;
      }
      localStorage.setItem(storageKey, JSON.stringify({
        text: textarea.value,
        tags: tagsInput ? tagsInput.value : '',
        savedAt: Date.now()
      }));
      setStatus('已保存', false);
    }

    function queueSave() {
      setStatus('保存中...', true);
      if (saveTimer) {
        clearTimeout(saveTimer);
      }
      saveTimer = window.setTimeout(saveDraft, 300);
    }

    function restoreDraft() {
      if (!storageKey) {
        return;
      }
      try {
        const raw = localStorage.getItem(storageKey);
        if (!raw) {
          return;
        }
        const data = JSON.parse(raw);
        if (data && typeof data.text === 'string' && !textarea.value.trim()) {
          textarea.value = data.text;
        }
        if (tagsInput && typeof data.tags === 'string' && !tagsInput.value.trim()) {
          tagsInput.value = data.tags;
          if (window.Tagify && tagsInput.tagify) {
            tagsInput.tagify.loadOriginalValues(data.tags);
          }
        }
      } catch (error) {
        console.warn('restore draft failed', error);
      }
    }

    function getSelectionRange() {
      const start = textarea.selectionStart ?? 0;
      const end = textarea.selectionEnd ?? 0;
      return { start, end, value: textarea.value };
    }

    function replaceSelection(before, after) {
      const range = getSelectionRange();
      const selected = range.value.slice(range.start, range.end);
      const nextValue = range.value.slice(0, range.start) + before + selected + after + range.value.slice(range.end);
      textarea.value = nextValue;
      const cursor = range.start + before.length + selected.length + after.length;
      textarea.focus();
      textarea.setSelectionRange(cursor, cursor);
      queueSave();
    }

    function wrapLinePrefix(prefix) {
      const range = getSelectionRange();
      const value = range.value;
      const lineStart = value.lastIndexOf('\n', range.start - 1) + 1;
      const lineEnd = value.indexOf('\n', range.end);
      const endIndex = lineEnd === -1 ? value.length : lineEnd;
      const line = value.slice(lineStart, endIndex);
      const nextLine = prefix + line.replace(/^\s*/, '');
      textarea.value = value.slice(0, lineStart) + nextLine + value.slice(endIndex);
      textarea.focus();
      textarea.setSelectionRange(lineStart + prefix.length, lineStart + prefix.length + line.length);
      queueSave();
    }

    function insertAtCursor(text) {
      const range = getSelectionRange();
      const nextValue = range.value.slice(0, range.start) + text + range.value.slice(range.end);
      textarea.value = nextValue;
      const cursor = range.start + text.length;
      textarea.focus();
      textarea.setSelectionRange(cursor, cursor);
      queueSave();
    }

    // --- Image upload helpers (used by toolbar, paste, and drag/drop) ---
    function getCookie(name) {
      const v = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
      return v ? v.pop() : '';
    }

    function ensureFileInput() {
      let input = document.getElementById('editorImageUploadInput');
      if (input) return input;
      input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.id = 'editorImageUploadInput';
      input.style.display = 'none';
      document.body.appendChild(input);
      input.addEventListener('change', function() {
        const file = input.files && input.files[0];
        if (!file) return;
        const token = `__IMG_UPLOAD_${Date.now()}_${Math.random().toString(36).slice(2)}__`;
        insertAtCursor(`![](${token})`);
        showToast('上传中：0%', false);
        uploadWithRetry(file, function(p) { showToast(`上传中：${Math.round(p*100)}%`, false); }, 3)
          .then(function(result) {
            if (result && result.ok && result.url) {
              textarea.value = textarea.value.replace(token, result.url);
              queueSave();
              showToast('图片上传完成', false);
            } else {
              textarea.value = textarea.value.replace(token, '');
              showToast('上传失败', true);
            }
            input.value = '';
          }).catch(function() {
            textarea.value = textarea.value.replace(token, '');
            showToast('上传失败', true);
            input.value = '';
          });
      });
      return input;
    }

    function uploadImageWithProgress(file, onProgress) {
      return new Promise(function(resolve, reject) {
        const xhr = new XMLHttpRequest();
        const url = '/learning_logs/api/upload-image/';
        const fd = new FormData();
        fd.append('image', file);
        xhr.open('POST', url, true);
        xhr.withCredentials = true;
        const csrftoken = getCookie('csrftoken');
        if (csrftoken) xhr.setRequestHeader('X-CSRFToken', csrftoken);
        xhr.upload.onprogress = function(e) {
          if (e.lengthComputable && typeof onProgress === 'function') {
            onProgress(e.loaded / e.total);
          }
        };
        xhr.onreadystatechange = function() {
          if (xhr.readyState === 4) {
            if (xhr.status >= 200 && xhr.status < 300) {
              try {
                const json = JSON.parse(xhr.responseText);
                resolve(json);
              } catch (err) {
                reject(err);
              }
            } else {
              reject(new Error('upload failed'));
            }
          }
        };
        xhr.onerror = function() { reject(new Error('network error')); };
        xhr.send(fd);
      });
    }

    // backward-compatible simple uploader (no progress)
    function compressImage(file, maxWidth = 1600, quality = 0.82) {
      return new Promise(function(resolve, reject) {
        if (!file.type.startsWith('image/')) return resolve(file);
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = function() {
          URL.revokeObjectURL(url);
          const w = img.naturalWidth;
          const h = img.naturalHeight;
          if (w <= maxWidth) {
            // no resize, but still re-encode to reduce size
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            canvas.toBlob(function(blob) {
              resolve(blob || file);
            }, 'image/jpeg', quality);
            return;
          }
          const ratio = maxWidth / w;
          const nh = Math.round(h * ratio);
          const canvas = document.createElement('canvas');
          canvas.width = maxWidth;
          canvas.height = nh;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, maxWidth, nh);
          canvas.toBlob(function(blob) {
            resolve(blob || file);
          }, 'image/jpeg', quality);
        };
        img.onerror = function() { URL.revokeObjectURL(url); resolve(file); };
        img.src = url;
      });
    }

    function uploadWithRetry(file, onProgress, attempts = 3) {
      return new Promise(function(resolve, reject) {
        let tried = 0;
        function attempt() {
          tried += 1;
          // compress only for larger files
          const needCompress = file.size > 800 * 1024;
          Promise.resolve(needCompress ? compressImage(file) : file).then(function(prepFile) {
            uploadImageWithProgress(prepFile, onProgress).then(function(res) {
              resolve(res);
            }).catch(function(err) {
              if (tried < attempts) {
                showToast(`上传失败，重试中 (${tried + 1}/${attempts})`, true);
                setTimeout(attempt, 800);
              } else {
                reject(err);
              }
            });
          }).catch(function(err) {
            if (tried < attempts) {
              setTimeout(attempt, 600);
            } else {
              reject(err);
            }
          });
        }
        attempt();
      });
    }

    // backward-compatible simple uploader (no progress)
    function uploadImage(file) {
      return uploadWithRetry(file, null, 3);
    }

    function showToast(msg, isError) {
      const container = document.getElementById('editorToast');
      if (!container) return;
      const node = document.createElement('div');
      node.className = 'toast';
      if (isError) node.style.borderColor = 'var(--danger)';
      node.textContent = msg;
      container.appendChild(node);
      window.setTimeout(function() { node.style.opacity = '0'; setTimeout(() => container.removeChild(node), 300); }, 3000);
    }

    function applyFormat(action) {
      if (action === 'bold') {
        replaceSelection('**', '**');
        return;
      }
      if (action === 'italic') {
        replaceSelection('_', '_');
        return;
      }
      if (action === 'strike') {
        replaceSelection('~~', '~~');
        return;
      }
      if (action === 'underline') {
        replaceSelection('<u>', '</u>');
        return;
      }
      if (action === 'quote') {
        wrapLinePrefix('> ');
        return;
      }
      if (action === 'codeBlock') {
        insertAtCursor('\n```\n\n```\n');
        return;
      }
      if (action === 'orderedList') {
        wrapLinePrefix('1. ');
        return;
      }
      if (action === 'bulletList') {
        wrapLinePrefix('- ');
        return;
      }
      if (action === 'todoList') {
        wrapLinePrefix('- [ ] ');
        return;
      }
      if (action === 'link') {
        const url = window.prompt('请输入链接地址');
        if (!url) return;
        replaceSelection('[', `](${url})`);
        return;
      }
      if (action === 'image') {
        try {
          const input = ensureFileInput();
          input.click();
        } catch (err) {
          const url = window.prompt('请输入图片地址');
          if (!url) return;
          insertAtCursor(`![](${url})`);
        }
        return;
      }
      if (action === 'textColor') {
        const color = window.prompt('请输入颜色值，例如 #1377EB');
        if (!color) return;
        replaceSelection(`<span style="color:${escapeHtml(color)}">`, '</span>');
        return;
      }
      if (action === 'highlight') {
        replaceSelection('<mark>', '</mark>');
        return;
      }
      if (action === 'fullscreen') {
        isFullscreen = !isFullscreen;
        document.body.classList.toggle('editor-fullscreen', isFullscreen);
        if (document.documentElement.requestFullscreen && isFullscreen) {
          document.documentElement.requestFullscreen().catch(function() {});
        } else if (document.fullscreenElement && !isFullscreen && document.exitFullscreen) {
          document.exitFullscreen().catch(function() {});
        }
      }
    }

    function showSelectionToolbar() {
      const start = textarea.selectionStart ?? 0;
      const end = textarea.selectionEnd ?? 0;
      if (start === end) {
        selectionToolbar.style.display = 'none';
        return;
      }
      const rect = textarea.getBoundingClientRect();
      const selectionTop = rect.top + window.scrollY - 56;
      const selectionLeft = Math.min(rect.left + window.scrollX + 20, window.scrollX + window.innerWidth - 280);
      selectionToolbar.style.top = `${Math.max(12, selectionTop)}px`;
      selectionToolbar.style.left = `${Math.max(12, selectionLeft)}px`;
      selectionToolbar.style.display = 'flex';
      if (hideToolbarTimer) {
        clearTimeout(hideToolbarTimer);
      }
      hideToolbarTimer = window.setTimeout(function() {
        if (document.activeElement !== textarea) {
          selectionToolbar.style.display = 'none';
        }
      }, 2500);
    }

    function syncHeadingControls() {
      const selection = textarea.value.slice(0, textarea.selectionStart ?? 0);
      const line = selection.split('\n').pop() || '';
      const match = line.match(/^(#{1,6})\s/);
      headingSelect.value = match ? `h${match[1].length}` : 'normal';
    }

    function applyHeading(value) {
      if (value === 'normal') {
        return;
      }
      const hashes = '#'.repeat(Number(value.slice(1)) || 1);
      wrapLinePrefix(`${hashes} `);
    }

    function applyFontSize(value) {
      if (value === 'normal') {
        return;
      }
      const sizeMap = {
        small: '0.92rem',
        medium: '1rem',
        large: '1.18rem',
        'x-large': '1.36rem'
      };
      const size = sizeMap[value] || '1rem';
      replaceSelection(`<span style="font-size:${size}">`, '</span>');
    }

    restoreDraft();

    textarea.addEventListener('input', queueSave);
    textarea.addEventListener('keyup', function() {
      syncHeadingControls();
      showSelectionToolbar();
    });
    textarea.addEventListener('mouseup', showSelectionToolbar);
    textarea.addEventListener('scroll', function() {
      selectionToolbar.style.display = 'none';
    });

    if (tagsInput) {
      tagsInput.addEventListener('input', queueSave);
      if (tagsInput.tagify) {
        tagsInput.tagify.on('add', queueSave);
        tagsInput.tagify.on('remove', queueSave);
      }
    }

    document.addEventListener('selectionchange', function() {
      if (document.activeElement === textarea) {
        showSelectionToolbar();
      }
    });

    // Keyboard shortcuts (Cmd/Ctrl + B/I/K, redo)
    document.addEventListener('keydown', function(e) {
      const mod = e.ctrlKey || e.metaKey;
      if (!mod) return;
      const key = (e.key || '').toLowerCase();
      if (key === 'b') {
        e.preventDefault();
        applyFormat('bold');
      } else if (key === 'i') {
        e.preventDefault();
        applyFormat('italic');
      } else if (key === 'k') {
        e.preventDefault();
        applyFormat('link');
      } else if ((e.shiftKey && key === 'z') || key === 'y') {
        e.preventDefault();
        try { document.execCommand('redo'); } catch (err) {}
      }
    });

    // Paste images from clipboard -> upload
    document.addEventListener('paste', function(e) {
      if (document.activeElement !== textarea) return;
      const items = (e.clipboardData && e.clipboardData.items) || [];
      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        if (item.kind === 'file' && item.type && item.type.startsWith('image/')) {
          e.preventDefault();
          const file = item.getAsFile();
          uploadWithRetry(file, function(p) { /* no-op for paste */ }, 3).then(function(result) {
            if (result && result.ok && result.url) {
              insertAtCursor(`![](${result.url})`);
            }
          }).catch(function() {});
          break;
        }
      }
    });

    // Drag & drop images into textarea
    textarea.addEventListener('dragover', function(e) { e.preventDefault(); });
    textarea.addEventListener('drop', function(e) {
      e.preventDefault();
      const files = (e.dataTransfer && e.dataTransfer.files) || [];
      for (let i = 0; i < files.length; i++) {
        const f = files[i];
        if (f.type && f.type.startsWith('image/')) {
          uploadWithRetry(f, function(p) { /* no-op for drop */ }, 3).then(function(result) {
            if (result && result.ok && result.url) {
              insertAtCursor(`![](${result.url})`);
            }
          }).catch(function() {});
        }
      }
    });

    document.addEventListener('click', function(event) {
      const target = event.target.closest('[data-editor-action], [data-inline-action]');
      if (!target) {
        return;
      }
      const action = target.getAttribute('data-editor-action') || target.getAttribute('data-inline-action');
      if (action) {
        applyFormat(action);
      }
    });

    headingSelect.addEventListener('change', function() {
      applyHeading(headingSelect.value);
      headingSelect.value = 'normal';
    });

    fontSizeSelect.addEventListener('change', function() {
      applyFontSize(fontSizeSelect.value);
      fontSizeSelect.value = 'normal';
    });

    form.addEventListener('submit', function() {
      if (saveTimer) {
        clearTimeout(saveTimer);
      }
      setStatus('已保存', false);
      if (storageKey) {
        localStorage.removeItem(storageKey);
      }
    });

    window.addEventListener('beforeunload', function() {
      if (saveTimer) {
        clearTimeout(saveTimer);
      }
      saveDraft();
    });
  })();
</script>
