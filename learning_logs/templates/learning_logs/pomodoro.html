{% extends 'learning_logs/base.html' %}

{% block title %}番茄工作法{% endblock title %}
{% block page_header %}番茄工作法{% endblock page_header %}

{% block content %}
<style>
  .pomodoro-wrap {
    max-width: 920px;
    margin: 0 auto;
  }

  .timer-shell {
    width: 280px;
    margin: 0 auto;
    position: relative;
  }

  .timer-ring-bg {
    stroke: #dfe6ee;
    stroke-width: 8;
    fill: none;
  }

  .timer-ring-main {
    stroke: #1f7ae0;
    stroke-width: 8;
    fill: none;
    stroke-linecap: round;
    transform: rotate(-90deg);
    transform-origin: 50% 50%;
    transition: stroke-dashoffset .35s linear, stroke .2s ease;
  }

  .timer-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .timer-time {
    font-size: 3rem;
    font-weight: 700;
    font-family: 'Space Grotesk', sans-serif;
    line-height: 1;
  }

  .timer-status {
    margin-top: .5rem;
    color: var(--text-secondary);
    font-size: .95rem;
  }

  .mode-toggle .btn {
    min-width: 120px;
  }
</style>

<div id="pomodoroPage" class="pomodoro-wrap">
  <div class="panel-card text-center mb-3">
    <div class="timer-shell">
      <svg viewBox="0 0 120 120" class="w-100">
        <circle class="timer-ring-bg" cx="60" cy="60" r="45"></circle>
        <circle id="timerRing" class="timer-ring-main" cx="60" cy="60" r="45"></circle>
      </svg>
      <div class="timer-center">
        <div id="timerDisplay" class="timer-time">25:00</div>
        <div id="timerStatus" class="timer-status">准备开始工作</div>
      </div>
    </div>

    <div class="d-flex justify-content-center gap-2 mt-3 flex-wrap">
      <button id="startBtn" class="btn btn-brand"><i class="bi bi-play-fill me-1"></i>开始</button>
      <button id="resetBtn" class="btn btn-outline-secondary"><i class="bi bi-arrow-counterclockwise me-1"></i>重置</button>
    </div>

    <div class="mode-toggle d-flex justify-content-center gap-2 mt-3">
      <button id="workModeBtn" class="btn btn-primary">工作模式</button>
      <button id="breakModeBtn" class="btn btn-outline-success">休息模式</button>
    </div>
  </div>

  <div class="panel-card">
    <h6 class="mb-3">自定义时间与今日统计</h6>
    <div class="row g-3 align-items-end mb-3">
      <div class="col-md-6">
        <label for="workMinutesInput" class="form-label">工作时间（分钟）</label>
        <input id="workMinutesInput" type="number" min="1" max="90" value="25" class="form-control">
      </div>
      <div class="col-md-6">
        <label for="breakMinutesInput" class="form-label">休息时间（分钟）</label>
        <input id="breakMinutesInput" type="number" min="1" max="60" value="5" class="form-control">
      </div>
    </div>

    <div class="row g-3 text-center">
      <div class="col-md-4">
        <div class="bg-light rounded-3 p-3 h-100">
          <div class="small text-secondary">已完成番茄数</div>
          <div id="completedPomodoros" class="fs-4 fw-bold">0</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="bg-light rounded-3 p-3 h-100">
          <div class="small text-secondary">专注时间（分钟）</div>
          <div id="focusMinutes" class="fs-4 fw-bold">0</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="bg-light rounded-3 p-3 h-100">
          <div class="small text-secondary">当前连续完成</div>
          <div id="currentStreak" class="fs-4 fw-bold">0</div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
