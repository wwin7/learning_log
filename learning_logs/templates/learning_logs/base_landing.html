<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LEARN HUB{% endblock title %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --brand: #3b82f6;
      --brand-dark: #2563eb;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --bg-soft: #f8fafc;
      --card-border: rgba(59, 130, 246, 0.16);
      --shadow-soft: 0 10px 30px rgba(15, 23, 42, 0.08);
      --shadow-hover: 0 16px 36px rgba(59, 130, 246, 0.18);
    }

    body {
      font-family: "Noto Sans SC", sans-serif;
      color: var(--text-main);
      background: linear-gradient(180deg, #f8fafc 0%, #eff6ff 48%, #f8fafc 100%);
      min-height: 100vh;
    }

    .brand-name {
      font-family: "Space Grotesk", sans-serif;
      letter-spacing: .04em;
      font-weight: 700;
      color: var(--text-main);
      text-decoration: none;
    }

    .btn-brand {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    .btn-brand:hover {
      background: var(--brand-dark);
      border-color: var(--brand-dark);
      color: #fff;
    }

    .hero-card {
      background: #fff;
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      box-shadow: var(--shadow-soft);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .hero-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
    }

    .feature-card {
      background: #fff;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 1rem;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .feature-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-hover);
    }

    .feature-icon {
      color: var(--brand);
      font-size: 1.8rem;
      line-height: 1;
    }

    .text-muted-custom {
      color: var(--text-muted);
    }
  </style>
  {% block extra_head %}{% endblock extra_head %}
</head>
<body>
  <nav class="navbar navbar-expand-lg py-3">
    <div class="container">
      <a class="brand-name fs-4" href="{% url 'learning_logs:index' %}">LEARN HUB</a>
      <div class="d-flex gap-2 ms-auto">
        {% if user.is_authenticated %}
        <a class="btn btn-brand rounded-pill px-4" href="{% url 'learning_logs:dashboard' %}">进入仪表盘</a>
        {% else %}
        <a class="btn btn-outline-primary rounded-pill px-4" href="{% url 'accounts:login' %}">登录</a>
        <a class="btn btn-brand rounded-pill px-4" href="{% url 'accounts:register' %}">免费注册</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock content %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
